name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,excel]"

      - name: Install lint dependencies
        run: python -m pip install "ruff>=0.5"

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Reject operating-system metadata files
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          bad = []
          for archive in Path("dist").iterdir():
              if archive.suffix == ".whl":
                  with zipfile.ZipFile(archive) as package:
                      names = package.namelist()
              elif archive.name.endswith(".tar.gz"):
                  with tarfile.open(archive, "r:gz") as package:
                      names = package.getnames()
              else:
                  continue
              bad.extend(name for name in names if Path(name).name == ".DS_Store")
          if bad:
              raise SystemExit("Unexpected metadata files in distributions: " + ", ".join(bad))
          PY
