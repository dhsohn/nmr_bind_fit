name: Feature request
description: Suggest a new capability or an improvement to the workflow.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What limitation or use case is this addressing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: scientific-context
    attributes:
      label: Scientific context
      description: >
        If relevant, describe the binding chemistry, stoichiometry, or
        model-selection scenario this supports. Keep model-selection language
        conservative: statistical ranking is not an automatic chemical-truth
        claim.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or existing workarounds, if any.
